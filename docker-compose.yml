services:
  sitesage:
    build: .
    container_name: sitesage-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - SITESAGE_DB_PATH=/app/data/sitesage.db
      - AI_POLISH_ENABLED=false
      - AI_POLISH_MODEL=gemini-1.5-flash
    volumes:
      - sitesage-data:/app/data

volumes:
  sitesage-data:
